[package]
name = "hebergtonserv-desktop"
version = "0.4.3"
description = "HébergTonServ Desktop — gestion des clés SSH, connexions et panels d'hébergement"
authors = ["HébergTonServ"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "hebergtonserv_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hebergtonserv-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-log = "=2.10.1"
tauri-plugin-store = "=2.5.0"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-process = "=2.4.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-snap-layout = "=1.0.9"

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["process", "fs", "time", "sync", "macros"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json", "http2", "charset"] }
ssh-key = { version = "=0.6.7", features = ["encryption", "ed25519", "rsa", "ecdsa", "rand_core"] }
keyring = "=4.2.0"
dirs = "=7.0.0"
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", features = ["serde"] }
zeroize = "=1.9.1"
async-trait = "=0.1.92"
ipnet = { version = "=2.12.2", features = ["serde"] }
base64 = "=0.23.1"
log = "=0.4.34"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
