name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Vite / React)
    # A public fork PR must never execute untrusted code on this self-hosted machine.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Verify pnpm already installed on self-hosted runner
        shell: pwsh
        run: |
          $expected = "12.15.0"
          $actual = pnpm --version
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -ne $expected) {
            throw "pnpm $expected required; found $actual. Install it on the Windows runner without overwriting Hermes."
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          # The Windows self-hosted runner has a populated pnpm content store.
          # Prefer it to avoid long registry stalls; fall back only when incomplete.
          pnpm install --frozen-lockfile --offline --reporter append-only
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Offline pnpm store incomplete; retrying with bounded registry requests.'
            pnpm install --frozen-lockfile --fetch-retries=1 --fetch-timeout=30000 --reporter append-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Runner CLI tests
        run: pnpm test:runner

      - name: Build Vite
        run: pnpm build

  backend:
    name: Rust (Windows / Tauri)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve Rust toolchain on Windows runner
        shell: pwsh
        run: |
          $toolchainBin = Join-Path $env:USERPROFILE '.rustup\toolchains\stable-x86_64-pc-windows-msvc\bin'
          if (-not (Test-Path (Join-Path $toolchainBin 'cargo.exe'))) {
            throw 'Stable Windows MSVC Rust toolchain not found. Install Rust with rustup.'
          }
          # The installed rustup proxy executables may be empty/corrupt on this runner.
          # Prioritize the complete toolchain without modifying files in ~/.cargo/bin.
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $toolchainBin -Encoding utf8
          & (Join-Path $toolchainBin 'cargo.exe') --version
          & (Join-Path $toolchainBin 'rustc.exe') --version

      - name: Cache Rust
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy (all targets)
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
