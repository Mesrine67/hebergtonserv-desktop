name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Vite / React)
    # Public-repository standard GitHub-hosted runners are free, isolating Node builds from the Windows packaging runner.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter append-only

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Runner CLI tests
        run: pnpm test:runner

      - name: Build Vite
        run: pnpm build

  backend:
    name: Rust (Windows / Tauri)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64]
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-x86_64-pc-windows-msvc
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Configure isolated application caches on E:"
        shell: pwsh
        run: ./scripts/configure-build-caches.ps1 -PersistForGitHub

      - name: Verify Rust toolchain
        shell: pwsh
        run: |
          $toolchainBin = Join-Path $env:USERPROFILE ".rustup\toolchains\$env:RUSTUP_TOOLCHAIN\bin"
          if (-not (Test-Path (Join-Path $toolchainBin 'cargo-clippy.exe'))) {
            throw "Pinned Rust toolchain or Clippy component is missing: $toolchainBin"
          }
          $env:PATH = "$toolchainBin;$env:PATH"
          $toolchainBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $toolchainBin 'rustc.exe') --version
          & (Join-Path $toolchainBin 'cargo.exe') --version
          & (Join-Path $toolchainBin 'cargo-clippy.exe') --version
          (Get-Command cargo).Source
          (Get-Command rustc).Source

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy (all targets)
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
