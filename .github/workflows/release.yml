name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      verifyOnly:
        description: Verify assets already present in the draft release without rebuilding.
        type: boolean
        required: true
        default: true

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag and aligned versions
        id: verify
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          node scripts/validate-release.mjs
  publish-tauri:
    needs: validate-source
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis,msi
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure updater signing is configured
        shell: pwsh
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY; refusing to publish unsigned updater artifacts."
          }
      - name: Build and publish signed update artifacts
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseDraft: true
          releaseBody: "Release automatique de HébergTonServ Desktop."
          generateReleaseNotes: true
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      - name: Release summary
        if: steps.tauri.outputs.releaseHtmlUrl != ''
        shell: bash
        run: |
          {
            echo "## Tauri Release"
            echo ""
            echo "- Platform: ${{ matrix.platform }}"
            echo "- Version: ${{ steps.tauri.outputs.appVersion }}"
            echo "- Draft release: ${{ steps.tauri.outputs.releaseHtmlUrl }}"
          } >> "$GITHUB_STEP_SUMMARY"
