name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      verifyOnly:
        description: Verify assets already present in the draft release without rebuilding.
        type: boolean
        required: true
        default: true

jobs:
  publish-tauri:
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: [self-hosted, Windows, X64]
            args: --bundles nsis,msi
    runs-on: [self-hosted, Windows, X64]
    env:
      RUSTUP_TOOLCHAIN: 1.95.0-x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify Rust toolchain
        shell: pwsh
        run: |
          $toolchainBin = Join-Path $env:USERPROFILE ".rustup\toolchains\$env:RUSTUP_TOOLCHAIN\bin"
          if (-not (Test-Path (Join-Path $toolchainBin 'rustc.exe'))) {
            throw "Pinned Rust toolchain is missing: $toolchainBin"
          }
          $env:PATH = "$toolchainBin;$env:PATH"
          $toolchainBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $toolchainBin 'rustc.exe') --version
          & (Join-Path $toolchainBin 'cargo.exe') --version
          (Get-Command rustc).Source
          (Get-Command cargo).Source

      - name: Rust cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
          dest: ${{ runner.temp }}/setup-pnpm
          run_install: false

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --reporter append-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure updater signing is configured
        shell: pwsh
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY; refusing to publish unsigned updater artifacts."
          }
      - name: Validate release tag and updater configuration
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne ('v' + $config.version)) {
            throw 'Tag and Tauri version mismatch; refusing release.'
          }
          if ($config.bundle.createUpdaterArtifacts -ne $true -or
              -not $config.plugins -or
              -not $config.plugins.updater -or
              [string]::IsNullOrWhiteSpace($config.plugins.updater.pubkey) -or
              -not $config.plugins.updater.endpoints) {
            throw 'Updater public key, HTTPS endpoints and signed artifact generation must be configured before releasing.'
          }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tag must reference a commit reachable from main.'
          }
      - name: Build and publish signed update artifacts
        id: tauri
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseDraft: true
          releaseBody: "Release automatique de HébergTonServ Desktop."
          generateReleaseNotes: true
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          includeUpdaterJson: true

      - name: Install Bun for standalone runner manager
        shell: pwsh
        run: |
          npm install --global bun@1.3.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun --version

      - name: Build standalone runner manager for Windows
        shell: pwsh
        run: |
          & ./scripts/build-runner.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attach standalone runner manager to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:GITHUB_REF_NAME "dist-runner/hebergtonserv-runner-manager.exe" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload experimental app and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & ./scripts/release-assets.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attest release files on GitHub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist-release/*'

      - name: Verify draft release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($required in @('latest.json', 'hebergtonserv-runner-manager.exe')) {
            if ($assets -notcontains $required) { throw "Missing release asset: $required" }
          }
          if (-not ($assets | Where-Object { $_ -like '*setup.exe' }) -or
              -not ($assets | Where-Object { $_ -like '*setup.exe.sig' }) -or
              -not ($assets | Where-Object { $_ -like '*.msi' }) -or
              -not ($assets | Where-Object { $_ -like '*.msi.sig' })) {
            throw 'Unsigned or incomplete Tauri release; keep draft.'
          }
          if ($assets.Count -ne 8 -or -not ($assets | Where-Object { $_ -like '*standalone-experimental.exe' })) {
            throw 'Expected eight release assets including standalone app and checksums.'
          }
          $manifest = Get-Content 'dist-release/latest.json' -Raw | ConvertFrom-Json
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($manifest.version -ne $config.version) { throw 'Updater JSON version mismatch.' }
          foreach ($platform in @('windows-x86_64','windows-x86_64-msi','windows-x86_64-nsis')) {
            $item = $manifest.platforms.$platform
            if (-not $item -or -not $item.signature -or -not $item.url) {
              throw "Missing signed updater entry for $platform"
            }
          }
          Write-Output ("Verified " + $assets.Count + " release assets.")

      - name: Release summary
        if: steps.tauri.outputs.releaseHtmlUrl != ''
        shell: pwsh
        env:
          RELEASE_URL: ${{ steps.tauri.outputs.releaseHtmlUrl }}
          APP_VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          @(
            '## Tauri Release',
            '',
            '- Platform: Windows x64',
            "- Version: $env:APP_VERSION",
            "- Draft release: $env:RELEASE_URL"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
