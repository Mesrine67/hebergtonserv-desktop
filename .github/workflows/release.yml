name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      verifyOnly:
        description: Verify assets already present in the draft release without rebuilding.
        type: boolean
        required: true
        default: true

jobs:
  publish-tauri:
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: [self-hosted, Windows, X64]
            args: --bundles nsis,msi
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Rust
        run: rustc --version && cargo --version

      - name: Rust cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure updater signing is configured
        shell: pwsh
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY; refusing to publish unsigned updater artifacts."
          }
      - name: Build and publish signed update artifacts
        id: tauri
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseDraft: true
          releaseBody: "Release automatique de HébergTonServ Desktop."
          generateReleaseNotes: true
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      - name: Release summary
        if: steps.tauri.outputs.releaseHtmlUrl != ''
        shell: bash
        run: |
          {
            echo "## Tauri Release"
            echo ""
            echo "- Platform: ${{ matrix.platform }}"
            echo "- Version: ${{ steps.tauri.outputs.appVersion }}"
            echo "- Draft release: ${{ steps.tauri.outputs.releaseHtmlUrl }}"
          } >> "$GITHUB_STEP_SUMMARY"
