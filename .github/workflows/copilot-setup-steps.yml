name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    # Never execute code from fork PRs or retargeted release tags on a personal Windows runner.
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve installed Rust MSVC toolchain
        shell: pwsh
        run: |
          $bin = Join-Path $env:USERPROFILE '.rustup\toolchains\stable-x86_64-pc-windows-msvc\bin'
          if (-not (Test-Path (Join-Path $bin 'cargo.exe'))) {
            throw 'Missing Windows MSVC Rust toolchain; install via rustup.'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin -Encoding utf8
          & (Join-Path $bin 'rustc.exe') --version
          & (Join-Path $bin 'cargo.exe') --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
